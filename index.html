<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holle × LetsFamily — Die Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF6EF;
    --cream-deep: #F3E9DA;
    --ink: #453E45;
    --ink-soft: #756B72;
    --pink: #CF0777;
    --pink-tint: #F6E1EC;
    --gold: #B9873F;
    --gold-tint: #F1E5CE;
    --line: #E4D9C9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: 72px 24px 100px;
  }

  h1, h2, h3, .display { font-family: 'Fraunces', serif; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }

  .wrap { max-width: 1100px; margin: 0 auto; }

  /* ---------- Partner lockup ---------- */

  .partner-lockup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 26px;
    margin-bottom: 20px;
  }

  .lf-logo-big { height: 58px; width: auto; display: block; }
  .ps-logo-big { height: 46px; width: auto; display: block; }
  .holle-logo-big { height: 76px; width: auto; display: block; }

  .lockup-x {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1.6rem;
    color: var(--ink-soft);
  }

  /* ---------- Current contract box ---------- */

  .current-box {
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 40px 36px;
    margin-bottom: 56px;
    background: var(--cream-deep);
  }

  .current-head {
    text-align: center;
    margin-bottom: 36px;
  }

  .current-head .badge {
    display: inline-block;
    background: var(--gold-tint);
    color: var(--gold);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .current-head p {
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  .current-items {
    display: flex;
    gap: 0;
    justify-content: center;
  }

  .current-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    max-width: 380px;
    text-align: center;
    padding: 0 56px;
  }

  .current-item + .current-item {
    border-left: 1px solid var(--line);
  }

  .current-item .phase-icon {
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .current-item-text h3 {
    font-size: 1.15rem;
    margin-bottom: 6px;
  }

  .current-item-text .phase-when {
    margin-bottom: 20px;
    white-space: nowrap;
  }

  .current-stats {
    display: flex;
    gap: 28px;
    margin-top: 14px;
    justify-content: center;
  }

  .phase-icon {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--cream);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .phase-icon svg { width: 34px; height: 34px; }

  .phase-when {
    font-size: 0.82rem;
    color: var(--pink);
    font-weight: 600;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    display: block;
    font-family: 'Fraunces', serif;
    font-size: 1.3rem;
    color: var(--ink);
  }

  .stat-label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  @media (max-width: 700px) {
    .current-items { flex-direction: column; gap: 44px; }
    .current-item { padding: 0; }
    .current-item + .current-item { border-left: none; border-top: 1px solid var(--line); padding-top: 44px; }
    .current-item-text .phase-when { white-space: normal; }
  }

  /* ---------- Header ---------- */

  .head {
    text-align: center;
    margin-bottom: 40px;
  }

  .greeting {
    font-family: 'Fraunces', serif;
    color: var(--ink-soft);
    font-size: 1.15rem;
    line-height: 1.5;
    margin-bottom: 24px;
  }

  .head h1 {
    font-size: clamp(1.9rem, 4vw, 2.7rem);
    max-width: 22ch;
    margin: 0 auto 16px;
    line-height: 1.25;
  }

  /* ---------- Tier switcher ---------- */

  .switcher {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 56px;
  }

  .tier-btn {
    font-family: 'Karla', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 11px 26px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .3s ease, color .3s ease, border-color .3s ease;
  }

  .tier-btn .full {
    font-weight: 400;
    opacity: 0.8;
  }

  .tier-btn.active {
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
  }

  .tier-btn:hover:not(.active) {
    border-color: var(--pink);
    color: var(--pink);
  }

  /* ---------- Tier content ---------- */

  .tier-panel {
    opacity: 0;
    transform: translateY(8px);
    animation: settle .5s ease forwards;
  }

  @keyframes settle { to { opacity: 1; transform: translateY(0); } }

  .ext-title {
    text-align: center;
    font-size: clamp(1.5rem, 3vw, 2rem);
    max-width: 30ch;
    margin: 0 auto 16px;
  }

  .ext-goal {
    text-align: center;
    max-width: 64ch;
    margin: 0 auto 56px;
    color: var(--ink-soft);
    font-size: 1.02rem;
  }

  .ext-goal strong {
    color: var(--ink);
    font-weight: 600;
  }

  .ext-items {
    display: flex;
    flex-direction: column;
    gap: 40px;
    max-width: 720px;
    margin: 0 auto;
  }

  .ext-item {
    display: flex;
    align-items: center;
    gap: 28px;
    padding-bottom: 40px;
    border-bottom: 1px solid var(--line);
  }

  .ext-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .ext-item-visual {
    width: 84px;
    height: 96px;
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ext-item-visual img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }

  .num-badge {
    position: absolute;
    bottom: -4px;
    right: -4px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--pink);
    color: #fff;
    font-family: 'Fraunces', serif;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid var(--cream);
  }

  .ext-item-body h3 {
    font-size: 1.15rem;
    margin-bottom: 6px;
  }

  .ext-item-desc {
    color: var(--ink-soft);
    font-size: 0.96rem;
    margin-bottom: 10px;
  }

  .ext-item-meta {
    font-size: 0.85rem;
    color: var(--pink);
    font-weight: 600;
  }

  .ext-empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 0;
    border: 1px dashed var(--line);
    border-radius: 16px;
  }

  .total-block {
    text-align: center;
    margin-top: 56px;
  }

  .total-pill {
    display: inline-block;
    background: #fff;
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    padding: 14px 32px;
    border-radius: 999px;
    border: 1px solid var(--line);
  }

  .total-breakdown {
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .partner-box {
    text-align: center;
    max-width: 420px;
    margin: 32px auto 0;
    border-radius: 20px;
    padding: 36px 36px;
    background: linear-gradient(155deg, #E01D82, var(--pink));
    box-shadow: 0 18px 40px -18px rgba(207, 7, 119, 0.55);
  }

  .partner-box .badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  .partner-value {
    font-family: 'Fraunces', serif;
    font-size: 2.3rem;
    color: #fff;
    margin-bottom: 6px;
  }

  .partner-note {
    color: rgba(255,255,255,0.85);
    font-size: 0.88rem;
  }

  /* ---------- Offer table & recommendations ---------- */

  .offer-table {
    width: 100%;
    max-width: 640px;
    margin: 0 auto 56px;
    border-collapse: collapse;
    font-size: 0.95rem;
  }

  .offer-table th,
  .offer-table td {
    padding: 14px 16px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }

  .offer-table th:first-child,
  .offer-table td:first-child {
    text-align: left;
    color: var(--ink-soft);
    font-weight: 400;
  }

  .offer-table thead th {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    color: var(--ink);
    font-size: 1.02rem;
    border-bottom: 2px solid var(--line);
    padding-bottom: 16px;
  }

  .offer-table tbody td {
    color: var(--ink);
  }

  .offer-table tr.highlight-row td {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--pink);
    border-bottom: none;
    padding-top: 20px;
  }

  .offer-table tr.highlight-row td:first-child {
    font-family: 'Karla', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--ink-soft);
  }

  .recommendation-box {
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
    border-radius: 20px;
    padding: 40px 36px;
    background: linear-gradient(155deg, #E01D82, var(--pink));
    box-shadow: 0 18px 40px -18px rgba(207, 7, 119, 0.55);
  }

  .recommendation-box h3 {
    color: #fff;
    font-size: 1.2rem;
    margin-bottom: 26px;
  }

  .rec-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.25);
  }

  .rec-row.highlight {
    border-bottom: none;
    padding-top: 20px;
  }

  .rec-label {
    color: rgba(255,255,255,0.85);
    font-size: 0.9rem;
  }

  .rec-value {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    color: #fff;
  }

  .rec-row.highlight .rec-label {
    color: #fff;
    font-weight: 600;
  }

  .rec-row.highlight .rec-value {
    font-size: 1.6rem;
  }

  .rec-savings {
    margin-top: 18px;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 10px;
    border-radius: 10px;
  }

  .cta-wrap {
    text-align: center;
    margin-top: 48px;
  }

  .cta-tag {
    display: inline-block;
    color: var(--pink);
    font-family: 'Shadows Into Light', cursive;
    font-weight: 400;
    font-size: 2.3rem;
    transform: rotate(-3deg);
  }

  .contact-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    max-width: 480px;
    margin: 24px auto 0;
  }

  .contact-photo {
    width: 100px;
    height: 100px;
    border-radius: 18px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--line);
  }

  .contact-text {
    text-align: left;
  }

  .contact-text h3 {
    font-size: 1.05rem;
    margin-bottom: 2px;
  }

  .contact-role {
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }

  .contact-detail {
    color: var(--ink-soft);
    font-size: 0.88rem;
    line-height: 1.4;
  }

  @media (max-width: 500px) {
    .contact-box { flex-direction: column; text-align: center; }
    .contact-text { text-align: center; }
  }

  @media (max-width: 700px) {
    .offer-table { font-size: 0.85rem; }
    .offer-table th, .offer-table td { padding: 10px 8px; }
  }

  @media (max-width: 700px) {
    .ext-item { flex-direction: column; align-items: flex-start; gap: 16px; }
    .current-box { padding: 32px 24px; }
  }
</style>
</head>
